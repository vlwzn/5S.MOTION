<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact 5S.MOTION — motion and design studio." />
    <meta name="theme-color" content="#f5f2e9" />
    <meta name="site-base" content="/" />
    <title>Contact — 5S.MOTION</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <script src="/assets/js/script.js" defer></script>
  </head>
  <body data-page="contact" class="info-page">
    <main class="page-shell info-shell">
      <header class="masthead">
        <a class="wordmark" href="/" data-site-home aria-label="5S.MOTION home">
          <span>5S.</span>
          <span>MOTION</span>
        </a>
        <nav class="masthead-nav" aria-label="Main navigation">
          <a href="/about.html" data-page-link="about">About</a>
          <a class="is-active" href="/contact.html" data-page-link="contact">Contact</a>
        </nav>
      </header>

      <article class="info-content contact-content">
        <div class="info-heading">
          <p class="eyebrow" data-content-field="eyebrow">Start a project</p>
          <h1 data-content-field="title">Let’s make
it move.</h1>
        </div>

        <section class="contact-grid">
          <div class="contact-block">
            <p class="eyebrow" data-content-field="businessLabel">New business</p>
            <p class="contact-description" data-content-field="businessDescription">Tell us about your project, timeline, and what you want to achieve.</p>
            <a class="contact-link" data-content-email href="mailto:hello@5smotion.com">hello@5smotion.com ↗</a>
          </div>
          <div class="contact-block contact-block--studio">
            <p class="eyebrow" data-content-field="studioLabel">Studio</p>
            <p class="contact-location" data-content-field="studioLocation">Makassar, South Sulawesi
Indonesia</p>
            <a class="contact-link" href="/" data-site-home>View selected work ↗</a>
          </div>
        </section>
      </article>

      <footer class="footer info-footer">
        <span>© 5S.MOTION</span>
        <span class="coordinates">Makassar / Indonesia</span>
        <a href="/about.html" data-page-link="about" data-content-field="footerCta">About the studio</a>
      </footer>
    </main>
    <p class="site-content-error" data-site-content-error role="alert" hidden></p>
  </body>
</html>
