<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Selected project by 5S.MOTION, an independent motion and design studio."
    />
    <meta name="theme-color" content="#f5f2e9" />
    <title>Project — 5S.MOTION</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/script.js" defer></script>
  </head>
  <body data-page="project">
    <main class="detail-page" data-detail-page hidden>
      <header class="detail-header">
        <a class="detail-back" href="/" aria-label="Back to works">←</a>
        <a class="detail-wordmark" href="/">5S.MOTION</a>
        <span class="detail-period" data-detail-period></span>
      </header>

      <section class="detail-content" aria-labelledby="detail-title">
        <h1 class="detail-title" id="detail-title" data-detail-title></h1>

        <div class="detail-gallery" data-detail-gallery></div>

        <div class="detail-information">
          <section class="detail-copy">
            <h2 class="eyebrow">Project</h2>
            <p data-detail-description></p>
          </section>
          <section class="detail-credits">
            <h2 class="eyebrow">Credits</h2>
            <dl data-detail-credits></dl>
          </section>
        </div>
      </section>

      <footer class="detail-footer">
        <a class="next-project" data-next-project>
          <span class="eyebrow">Next project</span>
          <span class="next-project-title"><span data-next-title></span> <span aria-hidden="true">↗</span></span>
        </a>
        <a class="detail-home-link" href="/">All works <span aria-hidden="true">↗</span></a>
      </footer>
    </main>

    <p class="detail-message" data-detail-message role="alert" hidden></p>
  </body>
</html>
